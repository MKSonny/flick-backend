            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

            font-size: 1.2rem;
            color: #555;

    </section>

    <section class="content-section">
        <h2>회사 소개</h2>
        <p>
            2025년에 설립된 우리 회사는 최첨단 AI 기술과 빅데이터 분석을 통해 다양한 산업 분야에 혁신을 제공하고 있습니다.
            고객 중심의 사고방식으로 최고의 가치를 창출하는 것을 목표로 합니다.
        </p>

<footer class="footer">
